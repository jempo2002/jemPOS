<!-- Ruta: templates/_cookies.html
     Aviso de cookies. Se incluye en las paginas publicas (landing y legales).
     Requiere static/js/cookies.js cargado en el <head> sin defer y los estilos
     .cookies de static/css/landing.css.

     No viene oculto en el HTML: sin JavaScript el aviso igual se ve. El que ya
     acepto no lo llega a ver porque cookies.js marca <html data-cookies-ok>
     antes del primer pintado. -->
<div class="cookies" data-cookies role="region" aria-label="Aviso de cookies">
  <p class="cookies__texto">
    Usamos cookies propias para mantener tu sesion y recordar tus preferencias.
    No compartimos tus datos con terceros.
    <a class="cookies__enlace" href="{{ url_for('legal_bp.politica_privacidad') }}">Ver politica de privacidad</a>
  </p>
  <button class="cookies__btn" type="button" data-cookies-aceptar>Aceptar</button>
</div>
